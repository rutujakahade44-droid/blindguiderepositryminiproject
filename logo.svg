<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#g)" stroke-width="8"/>
  <!-- Eye ellipse -->
  <ellipse cx="100" cy="100" rx="60" ry="38" fill="none" stroke="url(#g)" stroke-width="7"/>
  <!-- Pupil -->
  <circle cx="100" cy="100" r="22" fill="url(#g)"/>
  <!-- Inner pupil -->
  <circle cx="100" cy="100" r="10" fill="#0a1628"/>
  <!-- AI scan lines -->
  <line x1="55"  y1="55"  x2="75"  y2="75"  stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="55"  x2="125" y2="75"  stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="55"  y1="145" x2="75"  y2="125" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="145" x2="125" y2="125" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
</svg>
